# .gitlab-ci.yml keyword reference
# https://docs.gitlab.com/ee/ci/yaml/

# Official Python 3.9 language image.
test_py: python
  before_script:
    - apt-get update
    - apt-get install python-dev gcc
    - pip install --upgrade pytest-cov wheel pip virtualenv build twine
    - pip install -e .
    - python -m spacy download en_core_web_sm
  script:
    - pytest --verbose
#    - pytest --doctest-modules --doctest-glob='*.adoc' --doctest-glob='*.rst' --doctest-glob='*.py' --verbose

