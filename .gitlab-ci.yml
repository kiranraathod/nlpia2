  build:
    stage: build
    script:
      - docker build -t test 


pages:
  image: python:3.9
  stage: deploy
  script:
    # m2r+mistune versions [required by Sphinx](https://github.com/CrossNox/m2r2/issues/40)
    - pip install sphinx recommonmark m2r==0.2.1 mistune==0.8.4
    - cd docs
    - make html
    - cp -r _build/html ../public
  artifacts:
    paths:
      - public/
  only:
    - main

