class: Digraph
name: multilayer-perceptron
engine: 'dot'
wrap_node_labels: True
wrap_edge_labels: True
# args:
#     - unix
# FIXME create perceptron.gv or .dot file by hand before automating in yaml here
filename: multilayer-perceptron.gv
node_attr:
  shape: circle  # plaintext box oval
  color: darkblue  # ugly color blue
  stroke: "3"  # thing line for circle
# style: filled
attr:
  rankdir: 'LR'
#  size: '6,6'
# TODO: node_attrs like shape and color per node or per node pair in edge
nodes:
  - "x_0_0 = 1.0"
  - "x_0_1"
  - "x_0_2"
edges:
  - ["x_0_0 = 1.0", "x_1_1", label: "w_0_0 = intercept_0"]
  - ["x_0_1", "x_1_1", label: "w_0_1"]
  - ["x_0_2", "x_1_1", label: "w_0_2"]
  
  # - ["x_0_0 = 1.0", "x_1_2", label: "w_1_0 = intercept_1"]
  # - ["x_0_1", "x_1_2", label: "w_1_1"]
  # - ["x_0_2", "x_1_2", label: "w_1_2"]
  
  - ["x_0_0 = 1.0", "sum(x_1 * w_1)", label: "w_1_0 = intercept_1"]
  - ["x_1_1", "sum(x_1 * w_1)", label: "w_1"]

  - ["sum(x_1 * w_1)", "z > threshold", label: "z"]
  - ["z > threshold", " ", label: "y=output"]
