class: Digraph
name: perceptron
engine: 'dot'
wrap_node_labels: True
wrap_edge_labels: False
# args:
#     - unix
# FIXME create perceptron.gv or .dot file by hand before automating in yaml here
filename: perceptron.gv
node_attr:
  shape: circle  # plaintext box oval
  color: darkblue  # ugly color blue
  stroke: "3"  # thing line for circle
# style: filled
attr:
  rankdir: 'LR'
#  size: '6,6'
# TODO: node_attrs like shape and color per node or per node pair in edge
nodes:
  - "x_0 = 1.0"
  - "x_1"
  - "x_2"
  - "x_..."
  - "x_n"
edges:
  - ["x_0 = 1.0", "sum(x * w)", label: "w_0 = intercept"]
  - ["x_1", "sum(x * w)", label: "w_1"]
  - ["x_2", "sum(x * w)", label: "w_2"]
  - ["x_...", "sum(x * w)", label: "w_..."]
  - ["x_n", "sum(x * w)", label: "w_n"]
  - ["sum(x * w)", "z > threshold", label: "z"]
  - ["z > threshold", " ", label: "y = output"]
